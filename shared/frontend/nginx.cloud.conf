server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html home.html;

    # Shared portal pages
    location = / {
        try_files /index.html =404;
    }

    location = /home.html {
        try_files /home.html =404;
    }

    location = /login.html {
        try_files /login.html =404;
    }

    location = /register.html {
        try_files /register.html =404;
    }

    # Shared static files
    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    location = /auth.js {
        try_files /auth.js =404;
    }

    # Assessment Tracker Frontend
    location /assessments/ {
        proxy_pass ${ASSESSMENT_FRONTEND_URL}/;

        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared Authentication API
    location /auth-api/ {
        proxy_pass ${AUTH_BACKEND_URL}/;

        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assessment Tracker API
    location /assessments-api/ {
        proxy_pass ${ASSESSMENT_BACKEND_URL}/;

        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Multi-Agent API disabled in Azure
    location /multi-agent-api/ {
        default_type application/json;
        return 503 '{"error":"Multi-Agent API is unavailable in the cloud deployment"}';
    }
}
