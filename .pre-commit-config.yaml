repos:
  - repo: local
    hooks:

      # SHARED RELEASE 2 - RUFF SECURITY
      - id: ruff-release2
        name: Ruff - Shared Release 2 Security
        entry: ruff check ai-services/
        language: system
        types: [python]
        files: ^ai-services/
        pass_filenames: false
        always_run: true

      # INDIVIDUAL - RUFF SECURITY
      - id: ruff-adrian
        name: Ruff - Adrian Assessment Tracker
        entry: ruff check --select S student-adrianvoljak/
        language: system
        types: [python]
        files: ^student-adrianvoljak/
        pass_filenames: false
        always_run: true

      # SHARED + INDIVIDUAL - SECRET SCANNING
      - id: detect-secrets
        name: Detect Secrets - Release 2
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]

      # SHARED RELEASE 2 - DEPENDENCY AUDIT
      - id: pip-audit-shared
        name: pip-audit - Shared Requirements
        entry: python scripts/audit_shared_dependencies.py
        language: system
        pass_filenames: false
        always_run: true

      # INDIVIDUAL - BACKEND DEPENDENCY AUDIT
      - id: pip-audit-adrian-backend
        name: pip-audit - Adrian Backend
        entry: pip-audit -r student-adrianvoljak/backend/requirements.txt
        language: system
        pass_filenames: false
        always_run: true

      # INDIVIDUAL - DATABASE DEPENDENCY AUDIT
      - id: pip-audit-adrian-database
        name: pip-audit - Adrian Database
        entry: pip-audit -r student-adrianvoljak/database/requirements.txt
        language: system
        pass_filenames: false
        always_run: true
