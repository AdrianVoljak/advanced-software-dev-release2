services:
  # Shared - User Database
  user-database:
    build:
      context: ./shared/database
      dockerfile: Dockerfile
    volumes:
      - user_database_data:/app/data
    restart: unless-stopped

  # Shared - Authentication Backend
  auth-backend:
    build:
      context: ./shared/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_SERVICE_URL: http://user-database:5003
    depends_on:
      - user-database
    ports:
      - "5011:5000"
    restart: unless-stopped

  # Shared - Portal Frontend
  portal-frontend:
    build:
      context: ./shared/frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx.conf
    container_name: portal-frontend
    environment:
      ASSESSMENT_FRONTEND_URL: http://assessment-frontend
      AUTH_BACKEND_URL: http://auth-backend:5000
      ASSESSMENT_BACKEND_URL: http://assessment-backend:5007
      MULTI_AGENT_SERVICE_URL: http://host.docker.internal:5013
    ports:
      - "8000:80"
    depends_on:
      - auth-backend
      - assessment-frontend
      - assessment-backend
    restart: unless-stopped

  # Adrian Voljak - Assessment Tracker Database
  assessment-database:
    build:
      context: ./student-adrianvoljak/database
      dockerfile: Dockerfile
    environment:
      DATABASE_PORT: 5008
    ports:
      - "5008:5008"
    restart: unless-stopped

  # Adrian Voljak - Assessment Tracker Backend
  assessment-backend:
    build:
      context: ./student-adrianvoljak
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: 5007
      DATABASE_SERVICE_URL: http://assessment-database:5008

      # Local AI services
      AI_ENABLED: "true"
      MCP_ENABLED: "true"
      RAG_ENABLED: "true"

      # Ollama running on Windows
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b

      # MCP and RAG running on Windows
      MCP_SERVER_URL: http://host.docker.internal:8011/mcp
      RAG_SERVER_URL: http://host.docker.internal:8012

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - assessment-database
    ports:
      - "5007:5007"
    restart: unless-stopped

  # Adrian Voljak - Assessment Tracker Frontend
  assessment-frontend:
    build:
      context: ./student-adrianvoljak/frontend
      dockerfile: Dockerfile
    depends_on:
      - assessment-backend
    expose:
      - "80"
    restart: unless-stopped

volumes:
  user_database_data:
