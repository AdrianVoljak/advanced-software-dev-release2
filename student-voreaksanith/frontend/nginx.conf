server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # The frontend calls /calendar-api (see window.CALENDAR_API in
    # index.html). Without this block those requests fall through to
    # try_files and return index.html, so every API call fails to parse.
    location /calendar-api/ {
        proxy_pass http://calendar-backend:5005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /calendar/ {
        proxy_pass http://calendar-backend:5005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
